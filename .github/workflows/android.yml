name: Android APK
on:
  push:
    paths: ['app/**', '*.gradle', 'gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug || {
            cat app/build/reports/lint-results-debug.txt
            exit 1
          }
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk widgetmemo.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose widgetmemo.apk
          sha256sum widgetmemo.apk > widgetmemo.apk.sha256
      - name: Publish APK directly (no ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" widgetmemo.apk widgetmemo.apk.sha256 --target "$GITHUB_SHA" --title "ウィジェットメモ APK #${GITHUB_RUN_NUMBER}" --notes "動作確認用のデバッグ署名APKです。APKファイルを直接ダウンロードしてインストールできます。"
